services:
  postgres:
    image: postgres:16-alpine
    container_name: hp_postgres
    environment:
      POSTGRES_DB: healthplatform
      POSTGRES_USER: hpuser
      POSTGRES_PASSWORD: hppassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: hp_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: hpuser
      MONGO_INITDB_ROOT_PASSWORD: hppassword123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: hp_redis
    ports:
      - "6379:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.3
    container_name: hp_keycloak
    command: start-dev --http-relative-path /admin
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin123
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    container_name: hp_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: hp_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: grafana123

  gateway:
    image: nginx:alpine
    container_name: hp_gateway
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - keycloak
      - grafana

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: hp_uptime
    restart: always
    ports:
      - "3333:3001"
    volumes:
      - uptime_data:/app/data

volumes:
  postgres_data:
  mongo_data:
  uptime_data: